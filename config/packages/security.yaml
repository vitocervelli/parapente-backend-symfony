security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Emite el token. Va antes que `api` para que /api/login no exija estar ya autenticado.
        login:
            pattern: ^/api/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    # Solo se aplica la PRIMERA regla que coincide: el orden importa y el
    # cajón de sastre va SIEMPRE al final.
    access_control:
        # Puertas de entrada
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/register$, roles: PUBLIC_ACCESS, methods: [POST] }

        # Lectura pública del catálogo, la disponibilidad y las cifras de la portada
        - { path: ^/api/services, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/locations, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/inclusion-items, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/availability, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/settings$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/stats$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/allies$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/gallery$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/reels$, roles: PUBLIC_ACCESS, methods: [GET] }

        # Cualquiera que haya iniciado sesión, sea cliente o administrador
        - { path: ^/api/me$, roles: IS_AUTHENTICATED_FULLY }

        # Zona del cliente y zona del panel
        - { path: ^/api/account, roles: ROLE_CUSTOMER }
        - { path: ^/api/bookings, roles: ROLE_CUSTOMER, methods: [POST] }
        - { path: ^/api/admin, roles: ROLE_ADMIN }

        # Todo lo demás bajo /api exige ser administrador
        - { path: ^/api, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
