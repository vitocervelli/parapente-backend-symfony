; Configuración de PHP solo para este proyecto (la lee el servidor de Symfony CLI).
; El límite global de 2M se queda corto para la foto de un comprobante hecha
; con el móvil; los controladores aplican sus propios topes por archivo
; (comprobantes 8M, galería: fotos 10M y vídeos 100M).
;
; OJO: MAMP y producción usan OTRO php.ini — replicar allí estos valores
; (y en Apache no dejar LimitRequestBody por debajo de ~140M; en nginx,
; client_max_body_size).
upload_max_filesize = 120M
post_max_size = 130M
max_execution_time = 120
